version: "3.8"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: joblens-db
    restart: always
    environment:
      POSTGRES_USER: joblens
      POSTGRES_PASSWORD: joblens_secret_password
      POSTGRES_DB: joblens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joblens -d joblens"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: joblens-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://joblens:joblens_secret_password@db:5432/joblens
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: joblens-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
